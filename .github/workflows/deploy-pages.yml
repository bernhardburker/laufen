name: Deploy Dashboard to GitHub Pages

on:
  # Allows manual refresh trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      force_full_history:
        description: 'Download full history (from 2000-01-01)'
        required: false
        type: boolean
        default: false

  # Recurring refresh every morning at 05:00 UTC
  schedule:
    - cron: '0 5 * * *'

  # Trigger build & deploy when templates, visualization, or workflow scripts change
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'templates/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/**'
      - 'config/**'

# Set permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.RUNNER_OVERRIDE || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment and install dependencies
        run: |
          chmod +x ./init.sh
          ./init.sh
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Run automated test suite
        run: |
          pytest tests/

      - name: Fetch activities from Intervals.icu
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID || '0' }}
        run: |
          mkdir -p data
          if [ -n "$INTERVALS_API_KEY" ]; then
            echo "Fetching fresh activities from Intervals.icu..."
            python3 src/integrations/download_intervals.py --output data/intervals_activities.json
          elif [ -f "data/intervals_activities.json" ]; then
            echo "Using existing data/intervals_activities.json..."
          else
            echo "::warning ::No INTERVALS_API_KEY secret configured and no existing data file. Generating empty dashboard."
            echo "[]" > data/intervals_activities.json
          fi

      - name: Generate Agentic AI Coach Review (agy)
        id: ai_coach
        continue-on-error: true
        env:
          AGY_MODEL: ${{ vars.AGY_MODEL || 'Gemini 3.7 Flash (Medium)' }}
          AGY_TIMEOUT: '3m'
        run: |
          chmod +x .github/scripts/run-ai-coach.sh
          ./.github/scripts/run-ai-coach.sh data/intervals_activities.json data/ai_coach_commentary.md config/athlete.json

      - name: Publish AI Coach Review to Job Summary
        if: always() && hashFiles('data/ai_coach_commentary.md') != ''
        run: |
          echo "## 🤖 KI-Laufcoach Analyse (Antigravity AI)" >> "$GITHUB_STEP_SUMMARY"
          cat data/ai_coach_commentary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate HTML Dashboard
        run: |
          python3 src/visualization/generate_dashboard.py \
            --input data/intervals_activities.json \
            --template templates/dashboard.html \
            --output dist/index.html \
            --ai-coach data/ai_coach_commentary.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
