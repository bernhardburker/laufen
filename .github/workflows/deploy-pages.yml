name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      athlete:
        description: 'Target athlete slug (leave empty to build all active athletes)'
        required: false
        type: string
        default: ''

  push:
    branches:
      - main
    paths:
      - 'src/visualization/**'
      - 'templates/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.RUNNER_OVERRIDE || 'self-hosted' }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          chmod +x ./init.sh ./run
          ./init.sh
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Restore latest athlete artifacts from Burkerserver volume
        run: |
          PERSIST_DIR="$HOME/dockerContainer/laufen"
          if [ -d "$PERSIST_DIR/athletes" ]; then
            cp -rf "$PERSIST_DIR/athletes/"* athletes/ 2>/dev/null || true
          fi
          if [ -d "$PERSIST_DIR/data" ]; then
            mkdir -p data
            cp -rf "$PERSIST_DIR/data/"* data/ 2>/dev/null || true
          fi

      - name: Generate HTML Dashboards
        run: |
          mkdir -p dist
          ./run dashboard --all

      - name: Synchronize generated dashboards to local Burkerserver directory
        if: success()
        run: |
          TARGET_DIR="$HOME/dockerContainer/laufen"
          if [ -d "$TARGET_DIR" ]; then
            mkdir -p "$TARGET_DIR/dist"
            cp -rf dist/* "$TARGET_DIR/dist/" 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
